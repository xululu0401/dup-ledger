<text x="96" y="116" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#4f6b91">DUP LEDGER · 多份材料的两两重合对账</text>
<text x="96" y="206" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="82" font-weight="800" fill="#22344e">雷同度对账台</text>
<text x="96" y="272" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="36" fill="#5a6d84">8 份作业里，哪几份其实是同一份？</text>
<text x="96" y="332" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" fill="#61738a">先摘掉全班都写的公共样板，再算两两净雷同度、双向包含度，按阈值连边成可疑组，</text>
<text x="96" y="372" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" fill="#61738a">再给出最长公共段作为证据。</text>
